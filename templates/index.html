<!DOCTYPE html>
<html>
<head>
    <title>Azure DevOps Bug Counter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .container {
            width: 450px;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        select,
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }

        .result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .error {
            margin-top: 20px;
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Azure DevOps Bug Counter</h1>

    <form method="POST" action="/count">

        <label for="project">Select Project</label>

        <select id="project" name="project" required>

            <option value="">-- Select Project --</option>

            {% for project in project_groups %}

                <option value="{{ project }}"
                    {% if selected_project == project %}selected{% endif %}>
                    {{ project }}
                </option>

            {% endfor %}

        </select>


        <label for="start_date">Start Date</label>

        <input
            type="date"
            id="start_date"
            name="start_date"
            value="{{ start_date or '' }}"
            required
        >


        <label for="end_date">End Date</label>

        <input
            type="date"
            id="end_date"
            name="end_date"
            value="{{ end_date or '' }}"
            required
        >


        <button type="submit">
            Bug Count
        </button>

    </form>


    {% if result is not none %}

        <div class="result">
            Unique Bug Count: {{ result }}
        </div>

    {% endif %}


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

</div>

</body>
</html>
